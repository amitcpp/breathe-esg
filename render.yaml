databases:
  - name: breathe-esg-db
    plan: free
    databaseName: breathe_esg
    user: breathe_esg

services:
  - type: web
    name: breathe-esg-api
    plan: free
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn breathe_esg.wsgi --log-file -"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: breathe-esg-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORS_ALLOW_ALL
        value: "True"
      - key: PYTHON_VERSION
        value: "3.10.0"
